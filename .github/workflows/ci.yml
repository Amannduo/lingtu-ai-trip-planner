name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lingtu_ci
          POSTGRES_USER: lingtu_ci
          POSTGRES_PASSWORD: lingtu_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingtu_ci -d lingtu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://lingtu_ci:lingtu_ci_password@localhost:5432/lingtu_ci' || 'sqlite:///./ci.db' }}
      AUTH_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      AMAP_API_KEY: ci-placeholder
      FLYAI_ENABLED: "false"
      VOLCENGINE_AGENT_ENABLED: "false"
      SEND_REAL_EMAILS: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts migrations

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
